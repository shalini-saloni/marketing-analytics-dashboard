<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketing Analytics Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg:       #0a0a0f;
    --surface:  #12121a;
    --border:   #1e1e2e;
    --text:     #e8e8f0;
    --muted:    #6b6b80;
    --accent:   #7c3aed;
    --accent2:  #06b6d4;
    --green:    #10b981;
    --yellow:   #f59e0b;
    --red:      #ef4444;
    --mono:     'Space Mono', monospace;
    --sans:     'Syne', sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    overflow-x: hidden;
  }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 3px; }

  .app { display: flex; min-height: 100vh; }
  .sidebar {
    width: 220px; min-height: 100vh; background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    padding: 24px 0; position: fixed; top: 0; left: 0; z-index: 100;
  }
  .logo {
    padding: 0 20px 24px; border-bottom: 1px solid var(--border);
    font-family: var(--sans); font-weight: 800; font-size: 15px; letter-spacing: -0.5px;
  }
  .logo span { color: var(--accent); }
  .logo-sub { font-size: 10px; color: var(--muted); font-family: var(--mono); margin-top: 2px; letter-spacing: 1px; text-transform: uppercase; }
  .nav { margin-top: 16px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 20px; cursor: pointer; font-size: 13px;
    color: var(--muted); transition: all 0.15s;
    border-left: 3px solid transparent;
  }
  .nav-item:hover { color: var(--text); background: rgba(124,58,237,0.08); }
  .nav-item.active { color: var(--accent); border-left-color: var(--accent); background: rgba(124,58,237,0.12); }
  .nav-icon { font-size: 16px; width: 20px; text-align: center; }
  .main { margin-left: 220px; flex: 1; padding: 32px; min-width: 0; }
  .page-header { margin-bottom: 28px; }
  .page-title { font-size: 26px; font-weight: 800; letter-spacing: -1px; }
  .page-sub { color: var(--muted); font-size: 13px; font-family: var(--mono); margin-top: 4px; }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px;
  }
  .card-title {
    font-size: 11px; text-transform: uppercase; letter-spacing: 2px;
    color: var(--muted); font-family: var(--mono); margin-bottom: 12px;
  }

  .kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 28px; }
  .kpi-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px; position: relative; overflow: hidden;
  }
  .kpi-card::before {
    content: ''; position: absolute; top: 0; left: 0;
    width: 100%; height: 2px;
  }
  .kpi-card.purple::before { background: var(--accent); }
  .kpi-card.cyan::before   { background: var(--accent2); }
  .kpi-card.green::before  { background: var(--green); }
  .kpi-card.yellow::before { background: var(--yellow); }
  .kpi-card.red::before    { background: var(--red); }
  .kpi-label { font-size: 11px; color: var(--muted); font-family: var(--mono); letter-spacing: 1px; text-transform: uppercase; }
  .kpi-value { font-size: 28px; font-weight: 800; margin: 8px 0 0; letter-spacing: -1.5px; }
  .kpi-badge {
    display: inline-block; font-size: 11px; font-family: var(--mono);
    padding: 2px 8px; border-radius: 20px; margin-top: 6px;
  }
  .badge-green { background: rgba(16,185,129,0.15); color: var(--green); }
  .badge-yellow { background: rgba(245,158,11,0.15); color: var(--yellow); }
  .badge-red { background: rgba(239,68,68,0.15); color: var(--red); }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead tr { border-bottom: 2px solid var(--border); }
  thead th {
    padding: 10px 14px; text-align: left; font-size: 11px;
    color: var(--muted); font-family: var(--mono); letter-spacing: 1px; text-transform: uppercase;
    cursor: pointer; user-select: none; white-space: nowrap;
  }
  thead th:hover { color: var(--text); }
  thead th.sorted { color: var(--accent); }
  tbody tr { border-bottom: 1px solid var(--border); transition: background 0.1s; }
  tbody tr:hover { background: rgba(124,58,237,0.06); }
  tbody td { padding: 11px 14px; font-family: var(--mono); font-size: 12px; white-space: nowrap; }
  .sort-icon { margin-left: 4px; opacity: 0.4; }
  .sort-icon.active { opacity: 1; }

  .roas-badge {
    padding: 3px 10px; border-radius: 20px;
    font-size: 11px; font-weight: 700; font-family: var(--mono);
  }
  .roas-green  { background: rgba(16,185,129,0.15);  color: var(--green); }
  .roas-yellow { background: rgba(245,158,11,0.15);  color: var(--yellow); }
  .roas-red    { background: rgba(239,68,68,0.15);   color: var(--red); }

  .filters {
    display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; align-items: flex-end;
  }
  .filter-group { display: flex; flex-direction: column; gap: 5px; }
  .filter-group label { font-size: 11px; color: var(--muted); font-family: var(--mono); letter-spacing: 1px; text-transform: uppercase; }
  select, input[type="number"], input[type="text"] {
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text); padding: 8px 12px; border-radius: 8px;
    font-family: var(--mono); font-size: 12px; outline: none;
    transition: border-color 0.15s;
  }
  select:focus, input:focus { border-color: var(--accent); }
  .btn {
    background: var(--accent); color: #fff; border: none;
    padding: 9px 18px; border-radius: 8px; cursor: pointer;
    font-family: var(--sans); font-weight: 700; font-size: 12px;
    transition: opacity 0.15s; letter-spacing: 0.5px;
  }
  .btn:hover { opacity: 0.85; }
  .btn-ghost {
    background: transparent; border: 1px solid var(--border);
    color: var(--muted); padding: 8px 14px; border-radius: 8px;
    cursor: pointer; font-family: var(--mono); font-size: 12px; transition: all 0.15s;
  }
  .btn-ghost:hover { border-color: var(--accent); color: var(--text); }

  .chart-container { position: relative; height: 260px; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 28px; }

  .camp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .camp-card {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px; transition: border-color 0.15s;
  }
  .camp-card:hover { border-color: var(--accent); }
  .camp-name { font-weight: 700; font-size: 13px; margin-bottom: 4px; }
  .camp-channel { font-size: 11px; color: var(--muted); font-family: var(--mono); margin-bottom: 12px; }
  .camp-metrics { display: flex; gap: 16px; flex-wrap: wrap; }
  .camp-metric label { font-size: 10px; color: var(--muted); font-family: var(--mono); display: block; text-transform: uppercase; }
  .camp-metric span { font-size: 13px; font-family: var(--mono); }

  .insight-item {
    display: flex; gap: 14px; align-items: flex-start;
    padding: 16px; border-radius: 10px; margin-bottom: 12px;
    background: var(--bg); border: 1px solid var(--border);
    transition: border-color 0.15s;
  }
  .insight-item:hover { border-color: var(--accent); }
  .insight-num {
    width: 28px; height: 28px; border-radius: 50%;
    background: rgba(124,58,237,0.2); color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 12px; font-weight: 700; flex-shrink: 0;
  }
  .insight-text { font-size: 13px; line-height: 1.6; color: var(--text); }

  .month-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
  .month-tab {
    padding: 6px 14px; border-radius: 20px; cursor: pointer;
    font-family: var(--mono); font-size: 12px; border: 1px solid var(--border);
    color: var(--muted); transition: all 0.15s;
  }
  .month-tab:hover { border-color: var(--accent); color: var(--text); }
  .month-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .mom-indicator { display: flex; align-items: center; gap: 4px; font-size: 12px; font-family: var(--mono); }
  .mom-up   { color: var(--green); }
  .mom-down { color: var(--red); }

  .spinner-wrap { display: flex; justify-content: center; align-items: center; height: 200px; flex-direction: column; gap: 12px; }
  .spinner {
    width: 36px; height: 36px; border: 3px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner-text { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .error-box {
    background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3);
    border-radius: 10px; padding: 16px; color: var(--red); font-family: var(--mono); font-size: 13px;
  }

  .section { margin-bottom: 28px; }

  @media (max-width: 900px) {
    .sidebar { width: 60px; }
    .nav-item span, .logo-sub, .logo span { display: none; }
    .logo { padding: 0 12px 24px; text-align: center; }
    .main { margin-left: 60px; padding: 20px; }
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    .two-col { grid-template-columns: 1fr; }
  }
  @media (max-width: 600px) {
    .kpi-grid { grid-template-columns: 1fr; }
    .main { padding: 14px; }
    .sidebar { display: none; }
    .main { margin-left: 0; }
  }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  .fade-up { animation: fadeUp 0.3s ease both; }
</style>
</head>
<body>
    <div id="root"></div>
    <script>
        const { useState, useEffect, useRef, useCallback } = React;

        const API_BASE = (window.location.port === "5500" || window.location.protocol === "file:")
            ? "http://localhost:3001/api"
            : "/api";

        const fmt = (n, dec = 0) =>
            (n == null ? "—" : Number(n).toLocaleString("en-IN", { maximumFractionDigits: dec }));

        const fmtCurr = (n) =>
            n == null ? "—" : "₹" + fmt(n);

        const roasColor = (r) =>
            r >= 4 ? "roas-green" : r >= 2 ? "roas-yellow" : "roas-red";

        const roasBadgeClass = (r) =>
            r >= 3 ? "badge-green" : r >= 2 ? "badge-yellow" : "badge-red";

        function useFetch(url) {
        const [data, setData]     = useState(null);
        const [loading, setLoading] = useState(true);
        const [error, setError]   = useState(null);

        useEffect(() => {
            setLoading(true); setError(null);
            fetch(url)
            .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
            .then(d => { setData(d); setLoading(false); })
            .catch(e => { setError(e.message); setLoading(false); });
        }, [url]);

        return { data, loading, error };
        }

        function Spinner({ text = "Loading…" }) {
            return React.createElement("div", { className: "spinner-wrap" },
                React.createElement("div", { className: "spinner" }),
                React.createElement("div", { className: "spinner-text" }, text)
            );
        }

        function ErrorBox({ msg }) {
            return React.createElement("div", { className: "error-box" }, "⚠  " + msg);
        }

        const NAV = [
            { id: "overview",   label: "Overview",    icon: "◈" },
            { id: "channels",   label: "Channels",    icon: "⊞" },
            { id: "monthly",    label: "Monthly",     icon: "◷" },
            { id: "campaigns",  label: "Campaigns",   icon: "◉" },
            { id: "insights",   label: "Insights",    icon: "✦" },
        ];

        function Sidebar({ active, onNav }) {
            return React.createElement("aside", { className: "sidebar" },
                React.createElement("div", { className: "logo" },
                    React.createElement("div", null,
                        "Mkt", React.createElement("span", null, "Analytics")
                    ),
                    React.createElement("div", { className: "logo-sub" }, "Dashboard v1.0")
                ),
                React.createElement("nav", { className: "nav" },
                    NAV.map(item =>
                        React.createElement("div", {
                            key: item.id,
                            className: `nav-item ${active === item.id ? "active" : ""}`,
                            onClick: () => onNav(item.id),
                        },
                            React.createElement("span", { className: "nav-icon" }, item.icon),
                            React.createElement("span", null, item.label)
                        )
                    )
                )
            );
        }

        function OverviewPage() {
            const { data: sum, loading, error } = useFetch(`${API_BASE}/summary`);
            const { data: monthly } = useFetch(`${API_BASE}/monthly`);
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            useEffect(() => {
                if (!monthly || !chartRef.current) return;
                const months = monthly.monthly_data;
                if (chartInstance.current) chartInstance.current.destroy();
                chartInstance.current = new Chart(chartRef.current, {
                type: "bar",
                data: {
                    labels: months.map(m => m.month),
                    datasets: [
                    {
                        label: "Spend (₹)",
                        data: months.map(m => m.total_spend),
                        backgroundColor: "rgba(124,58,237,0.7)",
                        borderRadius: 6,
                        barPercentage: 0.55,
                    },
                    {
                        label: "Revenue (₹)",
                        data: months.map(m => m.total_revenue),
                        backgroundColor: "rgba(6,182,212,0.7)",
                        borderRadius: 6,
                        barPercentage: 0.55,
                    },
                    ],
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: {
                        legend: { labels: { color: "#6b6b80", font: { family: "Space Mono", size: 11 } } },
                        tooltip: { callbacks: { label: ctx => "₹" + Number(ctx.raw).toLocaleString("en-IN") } },
                    },
                    scales: {
                        x: { ticks: { color: "#6b6b80", font: { family: "Space Mono", size: 11 } }, grid: { color: "#1e1e2e" } },
                        y: { ticks: { color: "#6b6b80", font: { family: "Space Mono", size: 11 }, callback: v => "₹" + (v/1e6).toFixed(1)+"M" }, grid: { color: "#1e1e2e" } },
                    },
                },
                });
            }, [monthly]);

        if (loading) return React.createElement(Spinner, { text: "Fetching summary…" });
        if (error)   return React.createElement(ErrorBox, { msg: error });

        const s = sum;
        const kpis = [
            { label: "Total Spend",       value: fmtCurr(s.total_spend),       cls: "purple", badge: null },
            { label: "Total Revenue",     value: fmtCurr(s.total_revenue),     cls: "cyan",   badge: null },
            { label: "Total Conversions", value: fmt(s.total_conversions),     cls: "green",  badge: null },
            {
            label: "Overall ROAS",
            value: s.overall_roas.toFixed(2) + "x",
            cls: s.overall_roas >= 3 ? "green" : s.overall_roas >= 2 ? "yellow" : "red",
            badge: s.overall_roas >= 3 ? { text: "Strong", cls: "badge-green" } : { text: "Needs work", cls: "badge-red" },
            },
            { label: "Overall CPA",  value: fmtCurr(s.overall_cpa), cls: "yellow", badge: null },
            { label: "Overall CPC",  value: fmtCurr(s.overall_cpc), cls: "purple", badge: null },
        ];

        return React.createElement("div", { className: "fade-up" },
            React.createElement("div", { className: "page-header" },
            React.createElement("div", { className: "page-title" }, "Performance Overview"),
            React.createElement("div", { className: "page-sub" }, "Aggregate KPIs across all channels · all time")
            ),
            React.createElement("div", { className: "kpi-grid" },
            kpis.map((k, i) =>
                React.createElement("div", { key: i, className: `kpi-card ${k.cls}` },
                React.createElement("div", { className: "kpi-label" }, k.label),
                React.createElement("div", { className: "kpi-value" }, k.value),
                k.badge && React.createElement("span", { className: `kpi-badge ${k.badge.cls}` }, k.badge.text)
                )
            )
            ),
            React.createElement("div", { className: "card section" },
            React.createElement("div", { className: "card-title" }, "Monthly Spend vs Revenue"),
            React.createElement("div", { className: "chart-container" },
                React.createElement("canvas", { ref: chartRef })
            )
            )
        );
        }

        function ChannelsPage() {
            const [sortBy, setSortBy]   = useState("roas");
            const [order,  setOrder]    = useState("desc");
            const url = `${API_BASE}/channels?sort_by=${sortBy}&order=${order}`;
            const { data, loading, error } = useFetch(url);
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            useEffect(() => {
                if (!data || !chartRef.current) return;
                const chs = data.channels;
                if (chartInstance.current) chartInstance.current.destroy();
                chartInstance.current = new Chart(chartRef.current, {
                type: "radar",
                data: {
                    labels: ["ROAS", "CTR%", "CVR%", "Conversions (norm)", "Revenue (norm)"],
                    datasets: chs.map((c, i) => {
                    const colors = ["rgba(124,58,237,0.7)","rgba(6,182,212,0.7)","rgba(16,185,129,0.7)","rgba(245,158,11,0.7)","rgba(239,68,68,0.7)","rgba(168,85,247,0.7)","rgba(236,72,153,0.7)"];
                    const maxRev = Math.max(...chs.map(x => x.total_revenue));
                    const maxConv = Math.max(...chs.map(x => x.total_conversions));
                    return {
                        label: c.name,
                        data: [
                        Math.min((c.roas / 10) * 10, 10),
                        Math.min(c.avg_ctr, 10),
                        Math.min(c.avg_cvr, 10),
                        (c.total_conversions / maxConv) * 10,
                        (c.total_revenue / maxRev) * 10,
                        ],
                        backgroundColor: colors[i % colors.length].replace("0.7","0.15"),
                        borderColor: colors[i % colors.length],
                        borderWidth: 2, pointRadius: 3,
                    };
                }),
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: { labels: { color: "#6b6b80", font: { family: "Space Mono", size: 10 } } } },
                scales: { r: { grid: { color: "#1e1e2e" }, ticks: { display: false }, pointLabels: { color: "#6b6b80", font: { family: "Space Mono", size: 10 } } } },
            },
            });
        }, [data]);

        const toggleSort = (col) => {
            if (sortBy === col) setOrder(o => o === "desc" ? "asc" : "desc");
            else { setSortBy(col); setOrder("desc"); }
        };

        const SortTh = ({ col, children }) =>
            React.createElement("th", {
                className: sortBy === col ? "sorted" : "",
                onClick: () => toggleSort(col),
            },
            children,
                React.createElement("span", { className: `sort-icon ${sortBy === col ? "active" : ""}` },
                    sortBy === col ? (order === "desc" ? " ↓" : " ↑") : " ⇅"
            )
        );

        return React.createElement("div", { className: "fade-up" },
                React.createElement("div", { className: "page-header" },
                    React.createElement("div", { className: "page-title" }, "Channel Performance"),
                    React.createElement("div", { className: "page-sub" }, "Click column headers to sort")
                ),
                React.createElement("div", { className: "two-col" },
                React.createElement("div", { className: "card" },
                    React.createElement("div", { className: "card-title" }, "Channel Radar"),
                    React.createElement("div", { className: "chart-container" },
                    React.createElement("canvas", { ref: chartRef })
                    )
                ),
                React.createElement("div", { className: "card" },
                    React.createElement("div", { className: "card-title" }, "Quick Sort"),
                    React.createElement("div", { className: "filters" },
                    React.createElement("div", { className: "filter-group" },
                        React.createElement("label", null, "Sort By"),
                        React.createElement("select", { value: sortBy, onChange: e => setSortBy(e.target.value) },
                        ["roas","total_spend","total_revenue","total_conversions","cpa","cpc"].map(o =>
                            React.createElement("option", { key: o, value: o }, o.replace("total_","").toUpperCase())
                        )
                        )
                    ),
                React.createElement("div", { className: "filter-group" },
                    React.createElement("label", null, "Order"),
                    React.createElement("select", { value: order, onChange: e => setOrder(e.target.value) },
                    React.createElement("option", { value: "desc" }, "Descending"),
                    React.createElement("option", { value: "asc" },  "Ascending")
                    )
                )
                )
            )
            ),
        loading ? React.createElement(Spinner) :
        error   ? React.createElement(ErrorBox, { msg: error }) :
        React.createElement("div", { className: "card" },
        React.createElement("div", { className: "table-wrap" },
            React.createElement("table", null,
            React.createElement("thead", null,
                React.createElement("tr", null,
                React.createElement("th", null, "Channel"),
                React.createElement(SortTh, { col: "total_spend" }, "Spend"),
                React.createElement(SortTh, { col: "total_revenue" }, "Revenue"),
                React.createElement(SortTh, { col: "total_conversions" }, "Conversions"),
                React.createElement(SortTh, { col: "roas" }, "ROAS"),
                React.createElement(SortTh, { col: "cpa" }, "CPA"),
                React.createElement(SortTh, { col: "cpc" }, "CPC"),
                React.createElement("th", null, "CTR%"),
                React.createElement("th", null, "CVR%"),
                )
            ),
                React.createElement("tbody", null,
                    data.channels.map((c, i) =>
                    React.createElement("tr", { key: i },
                        React.createElement("td", { style: { fontFamily: "var(--sans)", fontWeight: 700, fontSize: 13 } }, c.name),
                        React.createElement("td", null, fmtCurr(c.total_spend)),
                        React.createElement("td", null, fmtCurr(c.total_revenue)),
                        React.createElement("td", null, fmt(c.total_conversions)),
                        React.createElement("td", null,
                        React.createElement("span", { className: `roas-badge ${roasColor(c.roas)}` },
                            Number(c.roas).toFixed(2) + "x"
                        )
                        ),
                        React.createElement("td", null, fmtCurr(c.cpa)),
                        React.createElement("td", null, fmtCurr(c.cpc)),
                        React.createElement("td", null, Number(c.avg_ctr).toFixed(2) + "%"),
                        React.createElement("td", null, Number(c.avg_cvr).toFixed(2) + "%"),
                    )
                    )
                )
                )
            )
            )
        );
        }

        function MonthlyPage() {
            const { data, loading, error } = useFetch(`${API_BASE}/monthly`);
            const [selectedMonth, setSelectedMonth] = useState(null);
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            const months = data?.monthly_data || [];

            useEffect(() => {
                if (months.length && !selectedMonth) setSelectedMonth(months[months.length - 1].month);
            }, [months]);

            useEffect(() => {
                if (!months.length || !chartRef.current) return;
                if (chartInstance.current) chartInstance.current.destroy();
                chartInstance.current = new Chart(chartRef.current, {
                type: "line",
                data: {
                    labels: months.map(m => m.month),
                    datasets: [
                    {
                        label: "ROAS",
                        data: months.map(m => m.roas),
                        borderColor: "rgba(124,58,237,1)", backgroundColor: "rgba(124,58,237,0.1)",
                        fill: true, tension: 0.4, pointBackgroundColor: "rgba(124,58,237,1)",
                    },
                    ],
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: { legend: { labels: { color: "#6b6b80", font: { family: "Space Mono", size: 11 } } } },
                    scales: {
                    x: { ticks: { color: "#6b6b80", font: { family: "Space Mono", size: 11 } }, grid: { color: "#1e1e2e" } },
                    y: { ticks: { color: "#6b6b80", font: { family: "Space Mono", size: 11 }, callback: v => v.toFixed(2) + "x" }, grid: { color: "#1e1e2e" } },
                    },
                },
                });
            }, [months]);

        const selected = months.find(m => m.month === selectedMonth);

        const MomChip = ({ val }) => {
            if (val == null) return React.createElement("span", { style: { color: "var(--muted)" } }, "—");
            const up = val >= 0;
            return React.createElement("span", { className: `mom-indicator ${up ? "mom-up" : "mom-down"}` },
            up ? "▲" : "▼", " ", Math.abs(val).toFixed(1) + "%"
            );
        };

        return React.createElement("div", { className: "fade-up" },
            React.createElement("div", { className: "page-header" },
            React.createElement("div", { className: "page-title" }, "Monthly Trends"),
            React.createElement("div", { className: "page-sub" }, "6 months · August 2025 – January 2026")
            ),
            loading ? React.createElement(Spinner) :
            error   ? React.createElement(ErrorBox, { msg: error }) :
            React.createElement("div", null,
            React.createElement("div", { className: "card section" },
                React.createElement("div", { className: "card-title" }, "ROAS Trend"),
                React.createElement("div", { className: "chart-container" },
                React.createElement("canvas", { ref: chartRef })
                )
            ),
             React.createElement("div", { className: "month-tabs" },
                months.map(m =>
                React.createElement("div", {
                    key: m.month,
                    className: `month-tab ${selectedMonth === m.month ? "active" : ""}`,
                    onClick: () => setSelectedMonth(m.month),
                }, m.month)
                )
            ),
            selected && React.createElement("div", { className: "kpi-grid" },
                [
                { label: "Spend",         value: fmtCurr(selected.total_spend), cls: "purple" },
                { label: "Revenue",       value: fmtCurr(selected.total_revenue), cls: "cyan" },
                { label: "Conversions",   value: fmt(selected.total_conversions), cls: "green" },
                { label: "ROAS",          value: Number(selected.roas).toFixed(2) + "x", cls: selected.roas >= 3 ? "green" : "yellow" },
                {
                    label: "Spend MoM",
                    value: React.createElement(MomChip, { val: selected.mom_spend_pct }),
                    cls: "yellow"
                },
                {
                    label: "Revenue MoM",
                    value: React.createElement(MomChip, { val: selected.mom_revenue_pct }),
                    cls: "purple"
                },
                ].map((k, i) =>
                React.createElement("div", { key: i, className: `kpi-card ${k.cls}` },
                    React.createElement("div", { className: "kpi-label" }, k.label),
                    React.createElement("div", { className: "kpi-value", style: { fontSize: 22 } }, k.value)
                )
                )
            ),
            React.createElement("div", { className: "card" },
                React.createElement("div", { className: "card-title" }, "All Months Summary"),
                React.createElement("div", { className: "table-wrap" },
                React.createElement("table", null,
                    React.createElement("thead", null,
                    React.createElement("tr", null,
                        React.createElement("th", null, "Month"),
                        React.createElement("th", null, "Spend"),
                        React.createElement("th", null, "Revenue"),
                        React.createElement("th", null, "Conversions"),
                        React.createElement("th", null, "ROAS"),
                        React.createElement("th", null, "Spend MoM"),
                        React.createElement("th", null, "Revenue MoM"),
                    )
                    ),
                    React.createElement("tbody", null,
                    months.map((m, i) =>
                        React.createElement("tr", {
                        key: i,
                        style: m.month === selectedMonth ? { background: "rgba(124,58,237,0.1)" } : {},
                        onClick: () => setSelectedMonth(m.month), style: { cursor: "pointer" },
                        },
                        React.createElement("td", null, m.month),
                        React.createElement("td", null, fmtCurr(m.total_spend)),
                        React.createElement("td", null, fmtCurr(m.total_revenue)),
                        React.createElement("td", null, fmt(m.total_conversions)),
                        React.createElement("td", null,
                            React.createElement("span", { className: `roas-badge ${roasColor(m.roas)}` }, Number(m.roas).toFixed(2) + "x")
                        ),
                        React.createElement("td", null,
                            m.mom_spend_pct != null
                            ? React.createElement("span", { className: `mom-indicator ${m.mom_spend_pct >= 0 ? "mom-up" : "mom-down"}` },
                                m.mom_spend_pct >= 0 ? "▲" : "▼", " ", Math.abs(m.mom_spend_pct).toFixed(1) + "%"
                                )
                            : React.createElement("span", { style: { color: "var(--muted)" } }, "—")
                        ),
                        React.createElement("td", null,
                            m.mom_revenue_pct != null
                            ? React.createElement("span", { className: `mom-indicator ${m.mom_revenue_pct >= 0 ? "mom-up" : "mom-down"}` },
                                m.mom_revenue_pct >= 0 ? "▲" : "▼", " ", Math.abs(m.mom_revenue_pct).toFixed(1) + "%"
                                )
                            : React.createElement("span", { style: { color: "var(--muted)" } }, "—")
                        ),
                        )
                    )
                    )
                )
                )
                )
                )
            );
        }

        function CampaignsPage() {
            const [channel, setChannel] = useState("");
            const [minRoas, setMinRoas] = useState("");
            const [maxRoas, setMaxRoas] = useState("");
            const [urlParams, setUrlParams] = useState("");
            const [tab, setTab] = useState("all");

            const { data, loading, error } = useFetch(`${API_BASE}/campaigns${urlParams}`);
            const { data: channelData } = useFetch(`${API_BASE}/channels`);
            const channels = channelData?.channels?.map(c => c.name) || [];

            const applyFilters = () => {
                const p = new URLSearchParams();
                if (channel) p.set("channel", channel);
                if (minRoas) p.set("min_roas", minRoas);
                if (maxRoas) p.set("max_roas", maxRoas);
                setUrlParams(p.toString() ? "?" + p.toString() : "");
            };

            const campaigns = data?.campaigns || [];
            const top5 = [...campaigns].sort((a, b) => b.roas - a.roas).slice(0, 5);
            const underperforming = campaigns.filter(c => c.total_spend > 50000 && c.roas < 2.0);
            const scaling = campaigns.filter(c => c.roas > 5.0 && c.total_spend < 20000);

            const CampCard = ({ c }) =>
                React.createElement("div", { className: "camp-card" },
                React.createElement("div", { className: "camp-name" }, c.campaign_name),
                React.createElement("div", { className: "camp-channel" }, c.channel_name),
                React.createElement("div", { className: "camp-metrics" },
                    React.createElement("div", { className: "camp-metric" },
                    React.createElement("label", null, "Spend"), React.createElement("span", null, fmtCurr(c.total_spend))
                    ),
                    React.createElement("div", { className: "camp-metric" },
                    React.createElement("label", null, "Revenue"), React.createElement("span", null, fmtCurr(c.total_revenue))
                    ),
                    React.createElement("div", { className: "camp-metric" },
                    React.createElement("label", null, "ROAS"),
                    React.createElement("span", { className: `roas-badge ${roasColor(c.roas)}` }, Number(c.roas).toFixed(2) + "x")
                    ),
                    React.createElement("div", { className: "camp-metric" },
                    React.createElement("label", null, "Conversions"), React.createElement("span", null, fmt(c.conversions))
                    ),
                )
                );

            const tabs = [
                { id: "all",     label: "All Campaigns" },
                { id: "top5",    label: `Top 5 ROAS` },
                { id: "under",   label: `⚠ Underperforming (${underperforming.length})` },
                { id: "scale",   label: `🚀 Scaling Opps (${scaling.length})` },
            ];

            const displayed = tab === "all" ? campaigns : tab === "top5" ? top5 : tab === "under" ? underperforming : scaling;

            return React.createElement("div", { className: "fade-up" },
            React.createElement("div", { className: "page-header" },
            React.createElement("div", { className: "page-title" }, "Campaign Performance"),
            React.createElement("div", { className: "page-sub" }, "28 campaigns across 7 channels")
            ),
            React.createElement("div", { className: "card section" },
            React.createElement("div", { className: "card-title" }, "Filters"),
            React.createElement("div", { className: "filters" },
                React.createElement("div", { className: "filter-group" },
                React.createElement("label", null, "Channel"),
                React.createElement("select", { value: channel, onChange: e => setChannel(e.target.value) },
                    React.createElement("option", { value: "" }, "All Channels"),
                    channels.map(c => React.createElement("option", { key: c, value: c }, c))
                )
                ),
                React.createElement("div", { className: "filter-group" },
                React.createElement("label", null, "Min ROAS"),
                React.createElement("input", { type: "number", placeholder: "e.g. 2.0", value: minRoas, onChange: e => setMinRoas(e.target.value), style: { width: 100 } })
                ),
                React.createElement("div", { className: "filter-group" },
                React.createElement("label", null, "Max ROAS"),
                React.createElement("input", { type: "number", placeholder: "e.g. 8.0", value: maxRoas, onChange: e => setMaxRoas(e.target.value), style: { width: 100 } })
                ),
                React.createElement("div", { className: "filter-group", style: { justifyContent: "flex-end" } },
                React.createElement("button", { className: "btn", onClick: applyFilters }, "Apply"),
                ),
                React.createElement("div", { className: "filter-group", style: { justifyContent: "flex-end" } },
                React.createElement("button", { className: "btn-ghost", onClick: () => { setChannel(""); setMinRoas(""); setMaxRoas(""); setUrlParams(""); } }, "Reset")
                ),
            )
            ),
            React.createElement("div", { className: "month-tabs section" },
            tabs.map(t =>
                React.createElement("div", { key: t.id, className: `month-tab ${tab === t.id ? "active" : ""}`, onClick: () => setTab(t.id) }, t.label)
            )
            ),
            loading ? React.createElement(Spinner) :
            error   ? React.createElement(ErrorBox, { msg: error }) :
            React.createElement("div", null,
            tab === "all" || tab === "top5"
                ? React.createElement("div", { className: "card" },
                    React.createElement("div", { className: "table-wrap" },
                    React.createElement("table", null,
                        React.createElement("thead", null,
                        React.createElement("tr", null,
                            React.createElement("th", null, "Campaign"),
                            React.createElement("th", null, "Channel"),
                            React.createElement("th", null, "Spend"),
                            React.createElement("th", null, "Revenue"),
                            React.createElement("th", null, "Conversions"),
                            React.createElement("th", null, "ROAS"),
                            React.createElement("th", null, "CPA"),
                        )
                        ),
                        React.createElement("tbody", null,
                        displayed.map((c, i) =>
                            React.createElement("tr", { key: i },
                            React.createElement("td", { style: { fontFamily: "var(--sans)", fontWeight: 600, fontSize: 13 } }, c.campaign_name),
                            React.createElement("td", null, c.channel_name),
                            React.createElement("td", null, fmtCurr(c.total_spend)),
                            React.createElement("td", null, fmtCurr(c.total_revenue)),
                            React.createElement("td", null, fmt(c.conversions)),
                            React.createElement("td", null,
                                React.createElement("span", { className: `roas-badge ${roasColor(c.roas)}` }, Number(c.roas).toFixed(2) + "x")
                            ),
                            React.createElement("td", null, fmtCurr(c.cpa)),
                            )
                        )
                        )
                    )
                    )
                )
                : React.createElement("div", { className: "camp-grid" },
                    displayed.length === 0
                    ? React.createElement("div", { style: { color: "var(--muted)", fontFamily: "var(--mono)", padding: 20 } }, "No campaigns match these criteria.")
                    : displayed.map((c, i) => React.createElement(CampCard, { key: i, c }))
                )
                )
            );
        }

        function InsightsPage() {
            const { data, loading, error } = useFetch(`${API_BASE}/insights`);

            return React.createElement("div", { className: "fade-up" },
                React.createElement("div", { className: "page-header" },
                React.createElement("div", { className: "page-title" }, "Insights & Recommendations"),
                React.createElement("div", { className: "page-sub" }, "Auto-generated from data analysis")
                ),
                loading ? React.createElement(Spinner, { text: "Fetching insights…" }) :
                error   ? React.createElement(ErrorBox, { msg: error }) :
                React.createElement("div", { className: "card" },
                data.generated_at && React.createElement("div", { style: { marginBottom: 16, color: "var(--muted)", fontFamily: "var(--mono)", fontSize: 11 } },
                    "Generated: " + new Date(data.generated_at).toLocaleString("en-IN")
                ),
                data.insights.map((ins, i) =>
                    React.createElement("div", { key: i, className: "insight-item" },
                    React.createElement("div", { className: "insight-num" }, i + 1),
                    React.createElement("div", { className: "insight-text" }, ins)
                    )
                )
                )
            );
        }

        function App() {
            const [page, setPage] = useState("overview");

            const pages = {
                overview:  React.createElement(OverviewPage),
                channels:  React.createElement(ChannelsPage),
                monthly:   React.createElement(MonthlyPage),
                campaigns: React.createElement(CampaignsPage),
                insights:  React.createElement(InsightsPage),
            };

            return React.createElement("div", { className: "app" },
                React.createElement(Sidebar, { active: page, onNav: setPage }),
                React.createElement("main", { className: "main" },
                pages[page] || React.createElement(OverviewPage)
                )
            );
            }

        ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
    </script>
</body>
</html>
